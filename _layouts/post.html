---
layout: default
---

<article class="blog-article">
  <header>
    <h1>{{ page.title | escape }}</h1>
    {% if page.date %}
      <p class="blog-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">
          📅 {{ page.date | date: "%Y年%m月%d日" }}
        </time>
      </p>
    {% endif %}
  </header>

  <div class="blog-content">
    {{ content }}
  </div>

  <footer style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--pico-muted-border-color);">
    <a href="/blog/" role="button" class="secondary outline">← ブログ一覧へ戻る</a>
  </footer>
</article>
