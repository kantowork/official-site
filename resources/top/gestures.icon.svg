<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2129"/>
      <stop offset="100%" stop-color="#0F1217"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#33E6FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00CCFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6"/>

  <!-- Trackpad Surface -->
  <rect x="72" y="114" width="368" height="296" rx="22" fill="#2E3340" fill-opacity="0.9" stroke="#596680" stroke-width="10"/>
  <!-- Click Divider Line -->
  <line x1="102" y1="356" x2="410" y2="356" stroke="#666666" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>

  <!-- Three Touch Points -->
  <circle cx="168" cy="230" r="48" fill="url(#glow)"/>
  <circle cx="168" cy="230" r="22" fill="#33E6FF"/>
  <circle cx="168" cy="230" r="9" fill="#FFFFFF"/>

  <circle cx="256" cy="220" r="48" fill="url(#glow)"/>
  <circle cx="256" cy="220" r="22" fill="#33E6FF"/>
  <circle cx="256" cy="220" r="9" fill="#FFFFFF"/>

  <circle cx="344" cy="230" r="48" fill="url(#glow)"/>
  <circle cx="344" cy="230" r="22" fill="#33E6FF"/>
  <circle cx="344" cy="230" r="9" fill="#FFFFFF"/>
</svg>
